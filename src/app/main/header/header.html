<div class="gap-2 md:w-auto flex w-full justify-between">
  @if (settingsXlHidden()) {
    <button
      type="button"
      labButton
      class="xl:inline-flex"
      [faIcon]="faSliders"
      size="large"
      [border]="false"
      [hide]="true"
      labTooltip="settings.header"
      [attr.aria-label]="'settings.header' | translate"
      (click)="settingsXlHidden.set(false)"
    ></button>
  }
  <button
    type="button"
    class="xl:hidden"
    labButton
    [faIcon]="faSliders"
    size="large"
    [border]="false"
    labTooltip="settings.header"
    [attr.aria-label]="'settings.header' | translate"
    (click)="toggleSettings()"
  ></button>
  <div class="flex gap-px">
    <a
      [routerLink]="['/', settingsStore.modId()]"
      labButton
      [text]="gameInfo().label"
      iconType="system"
      [icon]="game()"
      rounded="start"
      size="large"
      [border]="false"
      labTooltip="header.resetTooltip"
    ></a>
    <lab-select
      #gameSelect
      class="w-11 shrink-0"
      [attr.aria-label]="'header.selectGame' | translate"
      rounded="end"
      [iconOnly]="true"
      [border]="false"
      [options]="gameOptions()"
      (valueChange)="setGame($event)"
    >
      <fa-icon
        class="absolute text-gray-400 transition-transform"
        [class.-scale-y-100]="gameSelect.opened()"
        [icon]="faChevronDown"
      ></fa-icon>
    </lab-select>
  </div>
  <div class="min-w-0 flex grow gap-px md:grow-0">
    <lab-select
      class="w-40 sm:w-64 min-w-0 grow"
      rounded="start"
      [border]="false"
      placeholder="library.select"
      [attr.aria-label]="'library.select' | translate"
      [options]="library.options()"
      [value]="library.active()?.name ?? library.current()"
      (valueChange)="$event && library.open($event)"
    ></lab-select>
    @if (library.active()) {
      <button
        type="button"
        labButton
        size="large"
        [border]="false"
        [faIcon]="faLinkSlash"
        labTooltip="library.detach"
        [attr.aria-label]="'library.detach' | translate"
        (click)="library.detach()"
      ></button>
    }
    <button
      type="button"
      labButton
      rounded="end"
      size="large"
      [border]="false"
      [faIcon]="faBookOpen"
      labTooltip="library.header"
      [attr.aria-label]="'library.header' | translate"
      (click)="dialog.open(LibraryDialog)"
    ></button>
  </div>
  <button
    type="button"
    class="md:hidden"
    labButton
    [faIcon]="faUserGear"
    size="large"
    [border]="false"
    labTooltip="preferences.header"
    [attr.aria-label]="'preferences.header' | translate"
    (click)="togglePreferences()"
  ></button>
</div>
<div class="sm:gap-2 md:w-auto flex w-full items-center">
  @for (link of headerLinks; track link.text) {
    @if (link.href.startsWith('http')) {
      <a
        [href]="link.href"
        target="_blank"
        class="md:grow-0 grow"
        labButton
        [text]="link.text"
        [faIcon]="link.icon"
        size="small"
        [border]="false"
      ></a>
    } @else {
      <a
        [routerLink]="link.href"
        class="md:grow-0 grow"
        labButton
        [text]="link.text"
        [faIcon]="link.icon"
        size="small"
        [border]="false"
      ></a>
    }
  }
  <button
    type="button"
    class="md:inline-flex"
    labButton
    [faIcon]="faUserGear"
    size="large"
    [border]="false"
    [hide]="true"
    labTooltip="preferences.header"
    [attr.aria-label]="'preferences.header' | translate"
    (click)="togglePreferences()"
  ></button>
</div>
